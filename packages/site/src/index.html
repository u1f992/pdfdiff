<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>pdfdiff</title>
    <script type="module" src="./browser.js"></script>
  </head>
  <body>
    <h1>pdfdiff <small id="version"></small></h1>
    <form id="pdf-diff-form">
      <div>
        <label for="pdf-a">A:</label>
        <input type="file" id="pdf-a" accept="application/pdf" required />
      </div>
      <div>
        <label for="pdf-b">B:</label>
        <input type="file" id="pdf-b" accept="application/pdf" required />
      </div>
      <details id="options">
        <summary>Options</summary>
        <div>
          <label for="pdf-mask">Mask:</label>
          <input type="file" id="pdf-mask" accept="application/pdf" />
        </div>
        <div>
          <label for="dpi">DPI:</label>
          <input type="number" id="dpi" value="72" />
        </div>
        <div>
          <label for="alpha">Alpha:</label>
          <input type="checkbox" id="alpha" checked />
        </div>
        <div>
          <label for="workers">Workers:</label>
          <input type="number" id="workers" placeholder="auto" min="1" />
        </div>
        <div>
          <label for="addition-color">Addition:</label>
          <input type="color" id="addition-color" value="#4cae4f" />
        </div>
        <div>
          <label for="deletion-color">Deletion:</label>
          <input type="color" id="deletion-color" value="#ff5724" />
        </div>
        <div>
          <label for="modification-color">Modification:</label>
          <input type="color" id="modification-color" value="#ffc105" />
        </div>
        <div>
          <label for="diff-only">Diff only:</label>
          <input type="checkbox" id="diff-only" />
        </div>
        <div>
          <label for="out-type">Out type:</label>
          <select id="out-type">
            <option value="zip">zip</option>
            <option value="diff-pdf">diff-pdf</option>
            <option value="a-b-diff-pdf" selected>a-b-diff-pdf</option>
          </select>
        </div>
      </details>
      <button type="submit" id="submit">Submit</button>
    </form>
    <p id="message"></p>
    <!--
      Earlier deployments of this site registered coi-serviceworker to run
      cross-origin isolated. Browsers keep that registration until it is
      unregistered, so visitors from that time still have the old service
      worker controlling this page.
    -->
    <script>
      navigator.serviceWorker?.getRegistrations().then(async (registrations) => {
        for (const registration of registrations) {
          const worker = registration.active ?? registration.waiting ?? registration.installing;
          const unregistered = await registration.unregister();
          if (unregistered && worker?.scriptURL.includes("/coi-serviceworker")) {
            document.getElementById("message").textContent =
              "A service worker left by an earlier version of this site was removed. Reload the page before submitting.";
          }
        }
      });
    </script>
  </body>
</html>
